[project]
name = "cmd-guard"
version = "0.1.1"
description = "TypeSafe AI driven agent tool execution guard for Claude Code hooks"
readme = "README.md"
license = "MIT"
authors = [
    { name = "NieXi", email = "xilemon3@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["claude-code", "security", "agent", "llm-guard", "hooks", "ai-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "typesafe-sdk>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/NieXi/agent-guard"
Repository = "https://github.com/NieXi/agent-guard"
Issues = "https://github.com/NieXi/agent-guard/issues"

[project.scripts]
agent-guard = "agent_guard.cli:app"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# PyPI 发行名为 cmd-guard，但模块目录保持 src/agent_guard
module-name = "agent_guard"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
